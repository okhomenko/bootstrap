# macOS per-user configuration. Automatically loaded on macOS.
[bootstrap.hooks.post-dotfiles]
description = "Install Sublime Text Package Control"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  target="$HOME/Library/Application Support/Sublime Text/Installed Packages/Package Control.sublime-package"

  if [ ! -s "$target" ]; then
    mkdir -p "$(dirname "$target")"
    curl -fsSL --retry 3 \
      "https://download.sublimetext.com/Package%20Control.sublime-package" \
      -o "$target"
  fi
fi
'''

# Always auto-hide the menu bar. Writing _HIHideMenuBar with defaults only
# takes effect after logging in again; System Events applies it immediately.
[bootstrap.hooks.post-defaults]
description = "Auto-hide the macOS menu bar"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  osascript -e 'tell application "System Events" to set autohide menu bar of dock preferences to true' >/dev/null
fi
'''

[dotfiles]
"~/.config/kitty/kitty.conf" = { content = '''
font_family JetBrainsMonoNL Nerd Font Mono
font_size 15
shell_integration no-rc

editor nvim
kitty_mod ctrl+shift
background_opacity 1.0
dynamic_background_opacity no
inactive_text_alpha 1.0
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
remember_window_size no

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{custom}"

map kitty_mod+z toggle_layout stack
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+r clear_terminal reset active

# Shared split shortcuts
map kitty_mod+enter combine : goto_layout splits : launch --cwd=current --location=hsplit
map kitty_mod+backslash combine : goto_layout splits : launch --cwd=current --location=vsplit

# Platform-specific configuration
include ${KITTY_OS}.conf
''' }
"~/.config/kitty/tab_bar.py" = { content = '''
def draw_title(data):
    title = str(data.get("title", ""))
    if data.get("layout_name") == "stack":
        return "[Z] " + title
    return title
''' }

"~/.zshrc/homebrew-path" = {
  line = 'export PATH="/opt/homebrew/bin:$PATH"',
  position = "prepend"
}

"~/.ssh/config/1password-agent" = { block = '''
Host *
  IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
''' }

"~/.config/kitty/macos.conf" = { content = '''
macos_option_as_alt yes
hide_window_decorations titlebar-only
modify_font cell_height 6px

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
''' }

[dotfiles."~/Library/Application Support/Sublime Text/Packages/User/Package Control.sublime-settings"]
content = '''
{
  "installed_packages": [
    "Package Control",
    "JsFormat"
  ]
}
'''

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0.0
autohide_time_modifier = 0.0
magnification = false

[bootstrap.macos.keyboard]
automatic_spelling_correction = false

[bootstrap.macos.defaults.NSGlobalDomain]
NSAutomaticWindowAnimationsEnabled = false
NSWindowResizeTime = 0.001
NSScrollAnimationEnabled = false
QLPanelAnimationDuration = 0.0

[bootstrap.macos.defaults."com.apple.universalaccess"]
reduceMotion = true

[bootstrap.macos.defaults."com.apple.Safari"]
ShowStatusBar = true
ShowFullURLInSmartSearchField = true
IncludeDevelopMenu = true
WebAutomaticSpellingCorrectionEnabled = false
WebContinuousSpellCheckingEnabled = false
WebAutomaticTextReplacementEnabled = false


[bootstrap.macos.defaults."com.apple.dock"]
launchanim = false
expose-animation-duration = 0.1

[bootstrap.macos.defaults."com.apple.finder"]
DisableAllAnimations = true

[tasks.battery-saver]
description = "Optimize macOS battery power settings"
run = '''
#!/bin/sh
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
  exit 0
fi

# Turn display off after 5 minutes on battery.
# Slightly dim the display when unplugged.
sudo pmset -b displaysleep 5 lessbright 1
'''

[bootstrap.macos.launchd.agents.caps-to-esc]
program = "/usr/bin/hidutil"
args = [
  "property",
  "--set",
  '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":30064771129,"HIDKeyboardModifierMappingDst":30064771113}]}'
]
run_at_load = true
