# Bootstrap an AUR helper before mise processes aur: package entries.
# Keep the resulting yay package under pacman ownership, not under mise [tools].
[bootstrap.hooks.pre-packages]
description = "Install yay if no AUR helper is available"
run = '''
#!/bin/sh
set -eu

if command -v yay >/dev/null 2>&1 || command -v paru >/dev/null 2>&1; then
  exit 0
fi

if [ "$(id -u)" -eq 0 ]; then
  echo "Run mise bootstrap as a regular user, not root." >&2
  exit 1
fi

if [ ! -t 0 ]; then
  echo "Initial yay bootstrap requires an interactive terminal to review its PKGBUILD." >&2
  exit 1
fi

sudo pacman -S --needed git base-devel

build_dir="$(mktemp -d)"
trap 'rm -rf "$build_dir"' EXIT HUP INT TERM
git clone --depth 1 https://aur.archlinux.org/yay.git "$build_dir/yay"

echo "Review the yay AUR build recipe before continuing:"
cat "$build_dir/yay/PKGBUILD"
printf '\nBuild and install yay? [y/N] '
IFS= read -r answer
case "$answer" in
  y|Y|yes|YES|Yes) ;;
  *) echo "Canceled yay installation." >&2; exit 1 ;;
esac

(cd "$build_dir/yay" && makepkg -si)
'''

[bootstrap.packages]
"pacman:mise" = "latest"
"pacman:git" = "latest"
"pacman:base-devel" = "latest"
"pacman:gh" = "latest"
"pacman:zsh" = "latest"
"pacman:curl" = "latest"
"pacman:openssh" = "latest"
"pacman:kitty" = "latest"
"pacman:neovim" = "latest"
"pacman:fzf" = "latest"
"pacman:fd" = "latest"
"pacman:ripgrep" = "latest"
"pacman:btop" = "latest"
"pacman:lazygit" = "latest"
"pacman:tree-sitter-cli" = "latest"
"pacman:ttf-jetbrains-mono-nerd" = "latest"

# AUR packages require paru or yay and base-devel.
"aur:1password" = "latest"
"aur:1password-cli" = "latest"

[dotfiles]
"~/.config/kitty/linux.conf" = { content = '''
hide_window_decorations yes
modify_font cell_height 105%
font_size 12

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
''' }
