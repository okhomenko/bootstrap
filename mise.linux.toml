# Arch per-user configuration. Automatically loaded on Linux.
[dotfiles]
# Edit only a managed block; preserve Omarchy's theme include and local font size.
"~/.config/kitty/kitty.conf/bootstrap" = { block = '''
editor nvim
kitty_mod ctrl+shift
remember_window_size no
enable_audio_bell no
hide_window_decorations yes
modify_font cell_height 105%

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
active_tab_font_style bold
inactive_tab_font_style normal

map kitty_mod+z toggle_layout stack
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+r clear_terminal reset active
map kitty_mod+enter combine : goto_layout splits : launch --cwd=current --location=hsplit
map kitty_mod+backslash combine : goto_layout splits : launch --cwd=current --location=vsplit
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
''' }

# 1Password holds the key for the Arch hosts only; GitHub uses HTTPS.
"~/.ssh/config/1password-agent" = { block = '''
Host arch remote-arch
  IdentityAgent ~/.1password/agent.sock
''' }

[bootstrap.user]
login_shell = "/bin/zsh"
