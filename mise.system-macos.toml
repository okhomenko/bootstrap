# macOS system Homebrew packages and Command Line Tools prerequisite.
[bootstrap.packages]
"brew:lazygit" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:neovim" = "latest"
"brew:fzf" = "latest"
"brew:fd" = "latest"
"brew:ripgrep" = "latest"
"brew:jq" = "latest"
"brew:btop" = "latest"
"brew:herdr" = "latest"
"brew-cask:kitty" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:sublime-text" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:claude-code" = "latest"

[bootstrap.hooks.pre-packages]
description = "Ensure Apple Command Line Tools are installed"
run = '''
if [ "$(uname -s)" = "Darwin" ] && \
   ! xcode-select -p >/dev/null 2>&1; then
  xcode-select --install
  echo "Complete installation, then rerun mise bootstrap"
  exit 1
fi
'''
